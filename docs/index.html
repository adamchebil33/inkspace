<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Share page for LinkedIn and other link previews, served by GitHub Pages
      from this docs/ folder. LinkedIn's crawler can't read pages on
      workers.dev, so this page carries the preview tags and forwards people to
      the real app with JavaScript. Crawlers don't run JavaScript, so they stay
      here and read the tags. og:url must stay on github.io: pointing it (or a
      canonical link) at workers.dev sends LinkedIn back to the page it can't read.
    -->
    <title>Inkspace: a multiplayer whiteboard</title>
    <meta
      name="description"
      content="Inkspace: a multiplayer whiteboard. Share a link and draw together live."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inkspace" />
    <meta property="og:url" content="https://adamchebil33.github.io/inkspace/" />
    <meta property="og:title" content="Inkspace: a multiplayer whiteboard" />
    <meta
      property="og:description"
      content="A multiplayer whiteboard. Share a link and draw together live. No sign-up."
    />
    <meta property="og:image" content="https://adamchebil33.github.io/inkspace/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta
      property="og:image:alt"
      content="Inkspace: a whiteboard you share with a link. Live cursors, offline edits, AI summary. No sign-up. A board with sticky notes and two people's cursors."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      location.replace('https://inkspace.adamchebil.workers.dev/')
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f5;
        --fg: #1c1c1a;
        --muted: #6b6b66;
        --dot: #d4d4cf;
        --accent: #4f46e5;
        --accent-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161618;
          --fg: #ededeb;
          --muted: #9a9a94;
          --dot: #34343a;
          --accent: #818cf8;
          --accent-fg: #14141a;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background-color: var(--bg);
        background-image: radial-gradient(var(--dot) 1.3px, transparent 1.6px);
        background-size: 24px 24px;
        color: var(--fg);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      .logo {
        display: block;
        margin: 0 auto 20px;
      }
      p {
        margin: 0 0 20px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-fg);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#ffe066" />
        <path
          d="M7 20c3-9 6-9 9-1s6 4 9-6"
          fill="none"
          stroke="#1c1c1a"
          stroke-width="3"
          stroke-linecap="round"
        />
      </svg>
      <p>Opening Inkspace…</p>
      <a href="https://inkspace.adamchebil.workers.dev/">Continue to the app</a>
    </main>
  </body>
</html>
