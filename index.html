<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Inkspace: a multiplayer whiteboard. Share a link and draw together live."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Link previews (LinkedIn, Slack, X...). Crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inkspace" />
    <meta property="og:url" content="https://inkspace.adamchebil.workers.dev/" />
    <meta property="og:title" content="Inkspace: a multiplayer whiteboard" />
    <meta
      property="og:description"
      content="A multiplayer whiteboard. Share a link and draw together live. No sign-up."
    />
    <meta property="og:image" content="https://inkspace.adamchebil.workers.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta
      property="og:image:alt"
      content="Inkspace: a whiteboard you share with a link. Live cursors, offline edits, AI summary. No sign-up. A board with sticky notes and two people's cursors."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://inkspace.adamchebil.workers.dev/" />
    <title>Inkspace</title>
    <script>
      // Pick the theme before first paint so the page never flashes the wrong one.
      try {
        var theme = localStorage.getItem('inkspace:theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
